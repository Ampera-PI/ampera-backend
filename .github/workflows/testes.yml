
name: Testes Ampéra

on:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Corrigir Gradle
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Executar testes e gerar cobertura JaCoCo
        run: bash ./gradlew clean test jacocoTestReport

      - name: Salvar relatório dos testes JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/tests/test/
          if-no-files-found: warn

      - name: Salvar relatório de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: build/reports/jacoco/test/html/
          if-no-files-found: warn
